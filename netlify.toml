[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[images]
  remote_images = ["https:\\/\\/commons\\.wikimedia\\.org\\/.*", "https:\\/\\/upload\\.wikimedia\\.org\\/.*"]

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
