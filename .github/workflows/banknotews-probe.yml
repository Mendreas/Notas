name: Banknote.ws probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/banknotews-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe current GBP 50 page
        shell: python
        run: |
          import re, ssl, urllib.request, urllib.parse
          u='https://www.banknote.ws/COLLECTION/countries/EUR/GBR/GBRW0401.htm'
          ctx=ssl._create_unverified_context()
          req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=30,context=ctx) as r:
              html=r.read().decode('latin-1','replace')
          print('HTML_BYTES',len(html))
          imgs=re.findall(r'<img[^>]+src=["\']([^"\']+)',html,re.I)
          for x in imgs:
              print('IMG',urllib.parse.urljoin(u,x))
