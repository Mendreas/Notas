name: External link audit

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
  push:
    paths:
      - '.github/workflows/external-link-audit.yml'
      - 'scripts/audit-external-links.mjs'

permissions:
  contents: read

jobs:
  audit-links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Audit external links
        run: node scripts/audit-external-links.mjs
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-link-audit
          path: data/external-link-audit.json
          if-no-files-found: warn
