name: Cache remaining banknote assets

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cache-remaining-banknote-assets.yml'

permissions:
  contents: write

jobs:
  cache-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download banknote images from Wikipedia image repository
        shell: python
        run: |
          import json, pathlib, re, time, urllib.parse, urllib.request, urllib.error

          UA='Notas-do-Mundo/0.7.5 (personal educational visual atlas)'
          OUT=pathlib.Path('assets/notes')
          sets={
            'cny':[1,5,10,20,50,100],
            'sgd':[2,5,10,50,100,1000],
            'hkd':[10,20,50,100,500,1000],
            'mxn':[20,50,100,200,500,1000],
            'sek':[20,50,100,200,500,1000],
            'pln':[10,20,50,100,200,500],
            'czk':[100,200,500,1000,2000,5000],
            'ron':[1,5,10,20,50,100,200,500],
          }
          currency_terms={
            'cny':'Chinese yuan renminbi banknote',
            'sgd':'Singapore dollar banknote',
            'hkd':'Hong Kong dollar banknote',
            'mxn':'Mexican peso banknote',
            'sek':'Swedish krona banknote',
            'pln':'Polish zloty banknote',
            'czk':'Czech koruna banknote',
            'ron':'Romanian leu banknote',
          }
          side_terms={'front':['obverse','front'],'back':['reverse','back']}

          def api(params):
            url='https://en.wikipedia.org/w/api.php?'+urllib.parse.urlencode(params)
            req=urllib.request.Request(url,headers={'User-Agent':UA})
            for attempt in range(6):
              try:
                with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
              except urllib.error.HTTPError as e:
                if e.code==429:
                  time.sleep(8*(attempt+1)); continue
                raise
            raise RuntimeError('Wikipedia API rate limit')

          def search_file(currency,value,side):
            queries=[]
            for st in side_terms[side]:
              queries += [
                f'{currency_terms[currency]} {value} {st}',
                f'{value} {currency_terms[currency]} {st}',
              ]
            best=None
            for q in queries:
              data=api({'action':'query','format':'json','generator':'search','gsrnamespace':'6','gsrlimit':'12','gsrsearch':q,'prop':'imageinfo','iiprop':'url|mime'})
              pages=list(data.get('query',{}).get('pages',{}).values())
              for p in pages:
                title=p.get('title','').lower(); info=(p.get('imageinfo') or [{}])[0]
                mime=info.get('mime',''); url=info.get('url')
                if not url or not mime.startswith('image/'): continue
                score=0
                if str(value) in title: score+=5
                if any(t in title for t in side_terms[side]): score+=4
                if currency_terms[currency].split()[0].lower() in title: score+=2
                if 'banknote' in title or 'note' in title: score+=2
                if any(bad in title for bad in ['coin','stamp','old','obsolete','withdrawn']): score-=5
                if best is None or score>best[0]: best=(score,p['title'],url,mime)
              if best and best[0]>=8: break
              time.sleep(1)
            if not best: raise RuntimeError(f'No image for {currency} {value} {side}')
            return best

          def download(url):
            req=urllib.request.Request(url,headers={'User-Agent':UA,'Referer':'https://en.wikipedia.org/'})
            for attempt in range(8):
              try:
                with urllib.request.urlopen(req,timeout=60) as r:
                  ctype=r.headers.get('Content-Type',''); raw=r.read()
                if not ctype.startswith('image/') or len(raw)<5000: raise RuntimeError(f'Bad image {ctype} {len(raw)}')
                return raw,ctype
              except urllib.error.HTTPError as e:
                if e.code==429:
                  time.sleep(10*(attempt+1)); continue
                raise
            raise RuntimeError('image rate limit')

          failures=[]
          manifest={}
          for currency,values in sets.items():
            folder=OUT/currency; folder.mkdir(parents=True,exist_ok=True)
            manifest[currency]={}
            for value in values:
              manifest[currency][str(value)]={}
              for side in ('front','back'):
                try:
                  score,title,url,mime=search_file(currency,value,side)
                  raw,ctype=download(url)
                  ext='.jpg'
                  out=folder/f'{value}-{side}{ext}'
                  if 'jpeg' in ctype.lower() or 'jpg' in ctype.lower(): out.write_bytes(raw)
                  else:
                    tmp=folder/f'{value}-{side}.tmp'; tmp.write_bytes(raw)
                    from PIL import Image
                    Image.open(tmp).convert('RGB').save(out,quality=88,optimize=True)
                    tmp.unlink()
                  manifest[currency][str(value)][side]={'title':title,'source':url,'score':score}
                  print(currency,value,side,title,score)
                except Exception as e:
                  print('FAIL',currency,value,side,e)
                  failures.append([currency,value,side,str(e)])
                time.sleep(4)
          pathlib.Path('assets/notes/local-assets-manifest.json').write_text(json.dumps({'assets':manifest,'failures':failures},ensure_ascii=False,indent=2),encoding='utf-8')
          print('failures',len(failures))
      - name: Commit cached assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/notes/cny assets/notes/sgd assets/notes/hkd assets/notes/mxn assets/notes/sek assets/notes/pln assets/notes/czk assets/notes/ron assets/notes/local-assets-manifest.json
          if git diff --cached --quiet; then echo 'No asset changes'; else git commit -m 'Cache remaining banknote images locally'; git push; fi
