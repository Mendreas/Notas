name: Banknote context audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'data/context-run.txt'
jobs:
  context:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scrape exact front/back motifs
        run: python scripts/scrape-banknote-context.py
      - name: Build Portuguese context catalogue
        run: python scripts/build-note-context.py
      - name: Commit motif catalogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/banknote-context-raw.json note-context-catalog.js
          if ! git diff --cached --quiet; then
            git commit -m "Update exact banknote motif catalogue"
            git pull --rebase origin main
            git push origin main
          fi
