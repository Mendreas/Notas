name: Cache NZD banknote assets

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cache-nzd-assets.yml'

permissions:
  contents: write

jobs:
  cache-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Series 7 NZD images locally
        shell: python
        run: |
          import json, os, pathlib, urllib.parse, urllib.request

          OUT = pathlib.Path('assets/notes/nzd')
          OUT.mkdir(parents=True, exist_ok=True)
          UA = 'Notas-do-Mundo/0.7.4 (educational visual atlas)'

          queries = {
            '5-front': 'New Zealand five-dollar banknote Series 7',
            '5-back': 'New Zealand 5 dollar note reverse series 7',
            '10-front': 'New Zealand ten-dollar banknote Series 7',
            '10-back': 'New Zealand 10 dollar note reverse series 7',
            '20-front': 'New Zealand 20 dollar note obverse series 7',
            '20-back': 'New Zealand 20 dollar note reverse series 7',
            '50-front': 'New Zealand fifty-dollar banknote Series 7',
            '50-back': 'New Zealand 50 dollar note reverse series 7',
            '100-front': 'New Zealand one hundred-dollar banknote Series 7',
            '100-back': 'New Zealand 100 dollar note reverse series 7',
          }

          def api(params):
            url = 'https://commons.wikimedia.org/w/api.php?' + urllib.parse.urlencode(params)
            req = urllib.request.Request(url, headers={'User-Agent': UA})
            with urllib.request.urlopen(req, timeout=30) as r:
              return json.load(r)

          def image_url_for(search):
            data = api({'action':'query','format':'json','list':'search','srnamespace':'6','srlimit':'10','srsearch':search})
            hits = data.get('query',{}).get('search',[])
            if not hits:
              raise RuntimeError(f'No Commons result for {search}')
            # Prefer titles mentioning Series 7 and New Zealand.
            hits.sort(key=lambda h: (('series 7' not in h['title'].lower()), ('new zealand' not in h['title'].lower())))
            title = hits[0]['title']
            data = api({'action':'query','format':'json','prop':'imageinfo','iiprop':'url','titles':title})
            page = next(iter(data['query']['pages'].values()))
            return title, page['imageinfo'][0]['url']

          for key, search in queries.items():
            title, url = image_url_for(search)
            req = urllib.request.Request(url, headers={'User-Agent': UA})
            with urllib.request.urlopen(req, timeout=60) as r:
              ctype = r.headers.get('Content-Type','')
              raw = r.read()
            if not ctype.startswith('image/') or len(raw) < 10000:
              raise RuntimeError(f'Bad image for {key}: {title} {ctype} {len(raw)} bytes')
            ext = '.png' if 'png' in ctype.lower() else '.jpg'
            # Always use jpg path expected by the app; Pillow is available on runner, convert if necessary.
            tmp = OUT / f'{key}{ext}'
            tmp.write_bytes(raw)
            if ext != '.jpg':
              from PIL import Image
              im = Image.open(tmp).convert('RGB')
              im.save(OUT / f'{key}.jpg', quality=90, optimize=True)
              tmp.unlink()
            print(key, title, url)
      - name: Commit cached assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/notes/nzd
          if git diff --cached --quiet; then
            echo 'No asset changes'
          else
            git commit -m 'Cache NZD Series 7 images locally'
            git push
          fi
