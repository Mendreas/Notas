name: Cache NZD banknote assets

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cache-nzd-assets.yml'

permissions:
  contents: write

jobs:
  cache-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official RBNZ Series 7 images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/notes/nzd
          ua='Mozilla/5.0 Notas-do-Mundo/0.7.4'
          ref='https://www.rbnz.govt.nz/'
          declare -A urls
          urls['5-front']='https://www.rbnz.govt.nz/-/media/project/sites/rbnz/images/money-and-cash/banknotes-in-circulation/series-7/%245-front.jpg?h=244&hash=5B4B96999FD07BB81076B758130762C4&iar=0&w=500'
          urls['5-back']='https://www.rbnz.govt.nz/-/media/project/sites/rbnz/images/money-and-cash/banknotes-in-circulation/series-7/%245-back.jpg?h=244&hash=25D2D291E2E420618431E6D5FD29721C&iar=0&w=500'
          urls['10-front']='https://www.rbnz.govt.nz/-/media/project/sites/rbnz/images/money-and-cash/banknotes-in-circulation/series-7/%2410-front.jpg?h=243&hash=933507F6B5036C5277E516FA99FCF595&iar=0&w=500'
          urls['10-back']='https://www.rbnz.govt.nz/-/media/project/sites/rbnz/images/money-and-cash/banknotes-in-circulation/series-7/%2410-back.jpg?h=243&hash=7D1B7640B8D6EE271B51C691A0DB61F5&iar=0&w=500'
          urls['20-front']='https://www.rbnz.govt.nz/-/media/project/sites/rbnz/images/money-and-cash/banknotes-in-circulation/series-7/front-of-%2420-note.jpg?h=241&hash=A3D4D75EC642120563D6B3AFAED6F368&iar=0&w=500'
          urls['20-back']='https://www.rbnz.govt.nz/-/media/project/sites/rbnz/images/money-and-cash/banknotes-in-circulation/series-7/%2420-back.jpg?h=241&hash=C43EA0836C7E9A0A5FC66830ECDE8F09&iar=0&w=500'
          urls['50-front']='https://www.rbnz.govt.nz/-/media/project/sites/rbnz/images/money-and-cash/banknotes-in-circulation/series-7/%2450-front.jpg?h=240&hash=B483B91F9DCDAE960021D88EC14CB02F&iar=0&w=500'
          urls['50-back']='https://www.rbnz.govt.nz/-/media/project/sites/rbnz/images/money-and-cash/banknotes-in-circulation/series-7/%2450-back.jpg?h=240&hash=76789F1CD51615E7FF08E728FAD6EEFF&iar=0&w=500'
          urls['100-front']='https://www.rbnz.govt.nz/-/media/project/sites/rbnz/images/money-and-cash/banknotes-in-circulation/series-7/%24100-front.jpg?h=239&hash=8F54AA6BAE954DD3AA7ED839EC20DB76&iar=0&w=500'
          urls['100-back']='https://www.rbnz.govt.nz/-/media/project/sites/rbnz/images/money-and-cash/banknotes-in-circulation/series-7/%24100-back.jpg?h=239&hash=4868B179C6CDF8398FB1F66BDD4C3E93&iar=0&w=500'
          for key in "${!urls[@]}"; do
            out="assets/notes/nzd/${key}.jpg"
            curl -fL --retry 3 --retry-delay 2 -A "$ua" -e "$ref" -H 'Accept: image/avif,image/webp,image/apng,image/*,*/*;q=0.8' "${urls[$key]}" -o "$out"
            test -s "$out"
            file "$out" | grep -Eiq 'JPEG|image'
          done
      - name: Commit cached assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/notes/nzd
          if git diff --cached --quiet; then
            echo 'No asset changes'
          else
            git commit -m 'Cache official NZD Series 7 banknote images locally'
            git push
          fi
