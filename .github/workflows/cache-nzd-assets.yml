name: Cache NZD banknote assets

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cache-nzd-assets.yml'

permissions:
  contents: write

jobs:
  cache-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Series 7 NZD images locally
        shell: python
        run: |
          import json, pathlib, time, urllib.error, urllib.parse, urllib.request
          OUT = pathlib.Path('assets/notes/nzd')
          OUT.mkdir(parents=True, exist_ok=True)
          UA = 'Notas-do-Mundo/0.7.4 (educational visual atlas)'
          titles = {
            '5-front':'File:New Zealand five-dollar banknote, Series 7.jpg',
            '5-back':'File:New Zealand 5 dollar note reverse series 7.jpg',
            '10-front':'File:New Zealand ten-dollar banknote, Series 7.jpg',
            '10-back':'File:New Zealand 10 dollar note reverse series 7.jpg',
            '20-front':'File:New Zealand 20 dollar note obverse series 7.jpg',
            '20-back':'File:New Zealand 20 dollar note reverse series 7.jpg',
            '50-front':'File:New Zealand fifty-dollar banknote, Series 7.jpg',
            '50-back':'File:New Zealand 50 dollar note reverse series 7.jpg',
            '100-front':'File:New Zealand one hundred-dollar banknote, Series 7.jpg',
            '100-back':'File:New Zealand 100 dollar note reverse series 7.jpg',
          }
          def read_url(url, headers=None, tries=6):
            headers=headers or {}
            for attempt in range(tries):
              try:
                req=urllib.request.Request(url,headers=headers)
                with urllib.request.urlopen(req,timeout=90) as r:
                  return r.headers, r.read()
              except urllib.error.HTTPError as e:
                if e.code not in (429,503) or attempt==tries-1: raise
                wait=3*(attempt+1)
                print('rate limited; waiting',wait,'seconds')
                time.sleep(wait)
          def api(params):
            url='https://en.wikipedia.org/w/api.php?'+urllib.parse.urlencode(params)
            headers,raw=read_url(url,{'User-Agent':UA})
            return json.loads(raw)
          for key,title in titles.items():
            data=api({'action':'query','format':'json','prop':'imageinfo','iiprop':'url','titles':title})
            page=next(iter(data['query']['pages'].values()))
            if 'missing' in page or not page.get('imageinfo'):
              raise RuntimeError(f'Missing Wikipedia file for {key}: {title}')
            url=page['imageinfo'][0]['url']
            headers,raw=read_url(url,{'User-Agent':UA,'Referer':'https://en.wikipedia.org/'})
            ctype=headers.get('Content-Type','')
            if not ctype.startswith('image/') or len(raw)<10000:
              raise RuntimeError(f'Bad image for {key}: {title} {ctype} {len(raw)}')
            out=OUT/f'{key}.jpg'
            if 'jpeg' in ctype.lower() or 'jpg' in ctype.lower(): out.write_bytes(raw)
            else:
              tmp=OUT/f'{key}.tmp'; tmp.write_bytes(raw)
              from PIL import Image
              Image.open(tmp).convert('RGB').save(out,quality=90,optimize=True)
              tmp.unlink()
            print(key,title,url)
            time.sleep(2)
      - name: Commit cached assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/notes/nzd
          if git diff --cached --quiet; then echo 'No asset changes'; else git commit -m 'Cache NZD Series 7 images locally'; git push; fi
